services:
  postgres:
    image: postgres:16-alpine
    container_name: green-mall-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-green_mall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-green_mall_password}
      POSTGRES_DB: ${POSTGRES_DB:-green_mall}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-green_mall} -d ${POSTGRES_DB:-green_mall}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
